; AmbientVoiceSubtitles.ini -- NPC随口台词头顶字幕配置
; AmbientVoiceSubtitles.ini -- Floating subtitles for ambient NPC voice lines (barks)
;
; 改完保存即可，游戏里最多 2 秒自动生效，不用重启、不用重进地图。
; Save the file and the change applies within 2 seconds; no game restart needed.
;
; 世界单位是厘米：HeightCm=230 表示字幕中心在 NPC 上方 2.30 米。
; World units are centimeters: HeightCm=230 puts the text 2.30 m above the NPC.

[AmbientVoiceSubtitles]

; 字幕总开关：1 = 开启，0 = 关闭（不删文件就能临时停用）
; Master switch: 1 = on, 0 = off (keeps the file around for later)
Enabled=1


; 字幕语言：auto = 跟随游戏设置里的语言（推荐，改游戏语言后重进游戏即可）
; Subtitle language: auto = follow the Language setting in the game options
;                   (recommended; restart the game after changing it in-game)

; 想强制某种语言可填 English / German / French / Italian / Spanish / Polish / Russian，
; 也可以直接填列名，例如 English_Text（非官方语言补丁用）
; Force a language with English / German / French / Italian / Spanish / Polish / Russian,
; or a raw column name such as English_Text (for unofficial language patches)
Language=auto


; 字幕抬高（厘米）。偏高就调小，偏低就调大
; Subtitle lift in centimeters. Decrease if too high, increase if too low.
HeightCm=230


; 一句字幕停留多久（毫秒）。3000=3秒
; How long one line stays on screen, in milliseconds. 3000=3 seconds.
DurationMs=3000


; 淡出时长（毫秒）：最后这段时间透明度从 100% 降到 0%；0 = 不淡出，硬切
; Fade-out time in ms: opacity goes 100% -> 0% over this window. 0 = no fade.
FadeMs=800


; 距离淡出：1 = 离相机越远字越淡，超过 FadeEndM 米不画；0 = 关闭距离淡出。
; Distance fade: 1 = fainter with distance, skipped beyond FadeEndM meters;
;                0 = disable Distance fade.
DistanceFade=1


; 开始淡出的距离（米）
; Distance in meters where fading starts.
FadeStartM=10


; 完全不显示的距离（米）
; Distance in meters beyond which the text is not drawn at all.
FadeEndM=15


; 同屏最多几条（1~8）
; Max lines on screen at once (1-8).
MaxMessages=8


; 文字颜色：8 位 AARRGGBB，前两位是不透明度（FF=不透明，00=全透明，全透明游戏中会显示为黑色。）
; 也可以只写 6 位 RGB，程序会自动补 FF。
; 例：纯白 FFFFFF / 深红 DC143C / 深橙色 FF8C00 / 淡黄 FFFFCC
; Text color: 8-digit AARRGGBB (first two = alpha, FF = opaque, 00=fully transparent, the game will display black if fully transparent.)
; 6-digit RGB also works; FF is added automatically.
; e.g. white FFFFFF / crimson DC143C / dark orange FF8C00 / pale yellow FFFFCC
Color=FFFFFFFF
